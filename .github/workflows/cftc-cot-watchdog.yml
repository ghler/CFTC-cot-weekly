name: CFTC COT Watchdog

on:
  schedule:
    # Runs Saturday 06:00 UTC (10 hours after Friday 20:00 scheduled run)
    # Gives plenty of time for the main workflow to complete
    - cron: '0 6 * * 6'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  actions: read    # To read workflow run status
  issues: write    # To create notification issue

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    name: Verify Friday run & recover if needed
    permissions:
      contents: read
      actions: read    # To read workflow run status
      issues: write    # To create notification issue
    
    steps:
      - name: Get latest run of main workflow
        id: get_run
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cftc-cot.yml',  // workflow filename
              branch: 'main',
              event: 'schedule',
              per_page: 5
            });
            
            if (runs.workflow_runs.length === 0) {
              console.log('No scheduled runs found');
              return { found: false };
            }
            
            // Get the most recent scheduled run
            const latestRun = runs.workflow_runs[0];
            const runDate = new Date(latestRun.created_at);
            const now = new Date();
            const hoursSinceRun = (now - runDate) / (1000 * 60 * 60);
            
            console.log(`Latest scheduled run: #${latestRun.run_number} (${latestRun.conclusion || 'in_progress'})`);
            console.log(`Created: ${latestRun.created_at} (${hoursSinceRun.toFixed(1)} hours ago)`);
            console.log(`Status: ${latestRun.status}, Conclusion: ${latestRun.conclusion}`);
            
            // Check if it's from today/yesterday (Friday/Saturday)
            const friday = new Date();
            friday.setUTCHours(20, 0, 0, 0);  // Friday 20:00 UTC
            if (friday > now) friday.setUTCDate(friday.getUTCDate() - 7);  // last Friday
            
            const runDay = runDate.getUTCDay();  // 5 = Friday
            const isRecentFridayRun = runDay === 5 && hoursSinceRun < 24;
            
            return {
              found: true,
              run_id: latestRun.id,
              run_number: latestRun.run_number,
              conclusion: latestRun.conclusion,
              status: latestRun.status,
              created_at: latestRun.created_at,
              hours_ago: hoursSinceRun,
              is_recent_friday: isRecentFridayRun,
              html_url: latestRun.html_url
            };
      
      - name: Check run status
        id: check_status
        run: |
          RESULT='${{ steps.get_run.outputs.result }}'
          echo "Result: $RESULT"
          
          # Parse JSON from github-script output
          FOUND=$(echo "$RESULT" | jq -r '.found')
          CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion')
          STATUS=$(echo "$RESULT" | jq -r '.status')
          RUN_NUMBER=$(echo "$RESULT" | jq -r '.run_number')
          RUN_ID=$(echo "$RESULT" | jq -r '.run_id')
          IS_RECENT=$(echo "$RESULT" | jq -r '.is_recent_friday')
          HTML_URL=$(echo "$RESULT" | jq -r '.html_url')
          
          echo "found=$FOUND" >> $GITHUB_OUTPUT
          echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "run_number=$RUN_NUMBER" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "is_recent=$IS_RECENT" >> $GITHUB_OUTPUT
          echo "html_url=$HTML_URL" >> $GITHUB_OUTPUT
          
          if [ "$FOUND" = "false" ]; then
            echo "❌ No scheduled run found at all"
          elif [ "$IS_RECENT" = "false" ]; then
            echo "⚠️ Found run but not from recent Friday (run #$RUN_NUMBER, $STATUS/$CONCLUSION)"
          elif [ "$CONCLUSION" = "success" ]; then
            echo "✅ Friday run succeeded (run #$RUN_NUMBER)"
          else
            echo "❌ Friday run failed/incomplete (run #$RUN_NUMBER, $STATUS/$CONCLUSION)"
          fi
      
      - name: Re-trigger main workflow if needed
        id: retrigger
        if: steps.check_status.outputs.found == 'false' || steps.check_status.outputs.is_recent == 'false' || steps.check_status.outputs.conclusion != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cftc-cot.yml',
              ref: 'main'
            });
            console.log('Re-triggered workflow dispatch');
            return { triggered: true };
      
      - name: Create notification issue if re-triggered or failed
        if: steps.retrigger.outputs.triggered == 'true' || steps.check_status.outputs.conclusion != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'watchdog-alert',
              per_page: 10
            });
            
            // Check if there's already an open alert from today
            const today = new Date().toISOString().split('T')[0];
            const existingToday = issues.find(i => 
              i.title.includes('COT Watchdog Alert') && 
              i.created_at.startsWith(today)
            );
            
            if (existingToday) {
              console.log('Alert issue already exists for today:', existingToday.html_url);
              return;
            }
            
            const runNumber = '${{ steps.check_status.outputs.run_number }}';
            const conclusion = '${{ steps.check_status.outputs.conclusion }}';
            const status = '${{ steps.check_status.outputs.status }}';
            const htmlUrl = '${{ steps.check_status.outputs.html_url }}';
            const retriggered = '${{ steps.retrigger.outputs.triggered }}';
            
            let title, body;
            
            if (runNumber === '' || runNumber === 'null') {
              title = `🚨 COT Watchdog Alert: No Friday scheduled run found (${today})`;
              body = `**No scheduled workflow run was found for Friday's 20:00 UTC execution.**\n\n` +
                `The watchdog checked at ${new Date().toISOString()} UTC and found no schedule-triggered runs.\n\n` +
                `**Action taken:** ${retriggered === 'true' ? '✅ Re-triggered workflow via workflow_dispatch' : '❌ Could not re-trigger'}\n\n` +
                `**Next steps:**\n` +
                `1. Check the Actions tab for the main workflow: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/cftc-cot.yml\n` +
                `2. Verify the workflow file exists on the main branch\n` +
                `3. Check Settings → Actions → General → "Allow all actions" is enabled\n` +
                `4. Manually run the workflow if needed`;
            } else {
              title = `⚠️ COT Watchdog Alert: Friday run #${runNumber} failed (${today})`;
              body = `**Friday's scheduled run did not succeed.**\n\n` +
                `**Run:** #${runNumber} ([view](${htmlUrl}))\n` +
                `**Status:** ${status}\n` +
                `**Conclusion:** ${conclusion}\n` +
                `**Checked at:** ${new Date().toISOString()} UTC\n\n` +
                `**Action taken:** ${retriggered === 'true' ? '✅ Re-triggered workflow via workflow_dispatch' : '❌ Could not re-trigger'}\n\n` +
                `**Next steps:**\n` +
                `1. Check the failed run logs: ${htmlUrl}\n` +
                `2. Check if re-triggered run succeeds\n` +
                `3. Fix any issues in the main workflow`;
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['watchdog-alert', 'automated']
            });
            console.log('Created notification issue');
      
      - name: Summary
        run: |
          echo "## COT Watchdog Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Check time**: $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Friday run found**: ${{ steps.check_status.outputs.found }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Recent Friday run**: ${{ steps.check_status.outputs.is_recent }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run #**: ${{ steps.check_status.outputs.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.check_status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Conclusion**: ${{ steps.check_status.outputs.conclusion }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Re-triggered**: ${{ steps.retrigger.outputs.triggered }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_status.outputs.html_url }}" != "null" ]; then
            echo "- **Run URL**: ${{ steps.check_status.outputs.html_url }}" >> $GITHUB_STEP_SUMMARY
          fi